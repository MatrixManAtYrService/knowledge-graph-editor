[project]
name = "kge"
version = "0.1.0"
description = "Knowledge graph editor - JSON files in git, FastAPI server, browser UI for humans, CLI for agents"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.0",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.scripts]
kge = "kge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kge"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
